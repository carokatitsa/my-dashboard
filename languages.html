<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LingoArchive | Экзамен по группам</title>
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  
  <style>
    :root { 
      --bg-main: #06090f;
      --bg-card: #111a2e;
      --text-main: #e8eefc;
      --text-muted: #a9b6d3;
      --accent: #3498db;
      --gold: #f1c40f;
      --error: #ff6b6b;
      --success: #2ecc71;
      --heart: #e74c3c;
    }

    body { margin:0; font-family: 'Segoe UI', Arial, sans-serif; background: var(--bg-main); color: var(--text-main); }
    header { background:#111a2e; padding:16px; position:sticky; top:0; z-index: 100; border-bottom: 1px solid #1e2a44; }
    nav a { color: var(--text-main); margin-right:14px; text-decoration:none; font-weight:600; }
    
    main { max-width:900px; margin:auto; padding:24px; }
    .card { background: var(--bg-card); border-radius:14px; padding:20px; margin:16px 0; border: 1px solid #1e2a44; position: relative; }
    
    .btn { background: var(--accent); color: white; border: none; padding: 12px 18px; border-radius: 8px; cursor: pointer; font-weight: bold; transition: 0.3s; display: inline-flex; align-items: center; gap: 8px; font-size: 14px; }
    .btn:hover { opacity: 0.8; }
    
    input, textarea { background:#000; border:1px solid #333; color:#fff; padding:12px; border-radius:8px; width:100%; box-sizing:border-box; outline:none; font-size: 16px; }
    input:focus { border-color: var(--accent); }

    .test-word { font-size: 36px; color: var(--gold); margin: 20px 0; font-weight: bold; text-align: center; word-wrap: break-word; }
    
    .test-header-row { 
        display: flex; 
        justify-content: space-between; 
        align-items: center; 
        margin-bottom: 10px; 
        padding-bottom: 5px;
        border-bottom: 1px solid #1e2a44;
    }
    .test-q-count { font-size: 13px; color: var(--text-muted); margin: 0; }

    .feedback-note { background: #000; padding: 12px; border-radius: 8px; margin-top: 12px; border-left: 4px solid var(--accent); color: var(--text-muted); font-size: 14px; }
    .muted { color: var(--text-muted); font-size: 14px; }
    
    .fav-btn, .learn-btn { cursor: pointer; font-size: 20px; transition: 0.2s; background: none; border: none; padding: 0; line-height: 1; }
    .fav-btn.active { color: var(--heart); }
    .fav-btn.inactive, .learn-btn.inactive { color: #333; }
    .learn-btn.active { color: var(--success); }

    .add-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
    
    /* Стили для кнопок-групп */
    .group-selector { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0; }
    .group-chip { 
      background: #000; border: 1px solid #333; color: var(--text-muted);
      padding: 8px 16px; border-radius: 20px; cursor: pointer; font-weight: bold; font-size: 14px; transition: 0.2s;
    }
    .group-chip.active { background: var(--accent); color: white; border-color: var(--accent); }

    .result-box { padding: 15px; border-radius: 8px; margin-top: 15px; text-align: center; font-size: 18px; font-weight: bold; }
    .result-correct { background: rgba(46, 204, 113, 0.2); border: 1px solid var(--success); color: var(--success); }
    .result-wrong { background: rgba(255, 107, 107, 0.2); border: 1px solid var(--error); color: var(--error); }

    @media (max-width: 600px) { 
        .add-grid { grid-template-columns: 1fr; }
        main { padding: 15px; }
        .test-word { font-size: 28px; margin: 15px 0; }
        .card { padding: 15px; }
    }
  </style>
</head>
<body>

<header>
  <nav>
    <a href="index.html">🏠 Главная</a>
    <a href="languages.html" style="color:var(--gold)">📚 Мои Группы Слов</a>
  </nav>
</header>

<main>
  <h1>📚 Тренажер по Группам</h1>

  <!-- Переключатели языков -->
  <div style="display:flex; gap:8px; margin-bottom:15px; flex-wrap: wrap; align-items: center;">
    <button class="btn" id="btn-DE" onclick="setLang('DE')">🇩🇪 DE</button>
    <button class="btn" id="btn-IT" onclick="setLang('IT')">🇮🇹 IT</button>
    <button class="btn" id="btn-EN" onclick="setLang('EN')">🇬🇧 EN</button>
    <button class="btn" id="btn-PL" onclick="setLang('PL')">🇵🇱 PL</button>
    <button class="btn" id="btn-ES" onclick="setLang('ES')">🇪🇸 ES</button>
  </div>

  <!-- Панель выбора групп для экзамена -->
  <div class="card" style="border: 2px solid var(--gold); padding: 15px;">
    <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px;">
      <label style="font-weight: bold; color: var(--gold);">🎯 Выбери группы для экзамена (кликни, чтобы включить/выключить):</label>
      <div style="display:flex; gap:8px;">
        <button class="btn" style="background:#2c3e50; padding:6px 12px; font-size:12px;" onclick="toggleAllGroups(true)">Выбрать все</button>
        <button class="btn" style="background:#2c3e50; padding:6px 12px; font-size:12px;" onclick="toggleAllGroups(false)">Снять все</button>
      </div>
    </div>
    
    <!-- Контейнер для кнопок групп (1, 2, 3...) -->
    <div id="groupSelectorContainer" class="group-selector">
      <p class="muted">Загрузка групп...</p>
    </div>

    <button class="btn" style="background:var(--gold); color:#000; width:100%; justify-content:center; margin-top:10px;" onclick="startTestMode('selected_groups')">
      <i class="fas fa-pen-nib"></i> Запустить экзамен по выбранным группам
    </button>
  </div>

  <!-- Общие режимы экзамена -->
  <div style="display:flex; gap:10px; margin-bottom:20px; flex-wrap: wrap;">
    <button class="btn" style="background:var(--accent); color:#fff;" onclick="startTestMode('all')">
      <i class="fas fa-graduation-cap"></i> Экзамен (Все слова)
    </button>
    <button class="btn" style="background:var(--heart); color:#fff;" onclick="startTestMode('fav')">
      <i class="fas fa-heart"></i> Избранное
    </button>
    <button class="btn" style="background:var(--success); color:#fff;" onclick="startTestMode('learned')">
      <i class="fas fa-check-double"></i> Изученное
    </button>
  </div>

  <!-- Блок Экзамена -->
  <div id="testBox" class="card" style="display:none; border: 2px solid var(--gold);">
    <h2 id="testTitle" style="margin-top:0">📝 Письменный экзамен</h2>
    <div id="setupTest" style="text-align: center; padding: 20px 0;">
        <p id="testStatusMsg" style="font-weight:bold; color:var(--accent)"></p>
        <label>Количество вопросов:</label><br>
        <input id="testCount" type="number" value="10" min="1" style="width:100px; margin:10px 0; text-align:center;"><br>
        <button class="btn" style="background:var(--success); color:white" onclick="beginTest()">Начать тест!</button>
    </div>
    <div id="testArea"></div>
  </div>

  <!-- Форма добавления слов с указанием группы -->
  <div class="card" style="border: 1px solid var(--accent)">
    <h3 style="margin-top:0">➕ Добавить слово в группу</h3>
    <div class="add-grid">
        <input id="text" placeholder="Слово / Фраза">
        <input id="translation" placeholder="Перевод">
    </div>
    <div class="add-grid" style="margin-top: 10px;">
        <input id="groupInput" placeholder="Номер группы (например: 1, 2, 3...)">
        <div style="display: flex; align-items: center; color: var(--text-muted); font-size: 14px; padding-left: 5px;">
          💡 Укажи цифру или имя группы
        </div>
    </div>
    <textarea id="note" placeholder="Заметка (необязательно)" rows="2" style="margin-top: 10px;"></textarea>
    <button class="btn" id="addBtn" style="width:100%; margin-top:10px" onclick="add()">Сохранить в базу</button>
  </div>

  <h2 id="titleDisplay">Список слов</h2>
  <input id="search" placeholder="🔍 Поиск по словам..." oninput="applySearch()" style="margin-bottom:15px">

  <div id="list"></div>
</main>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getFirestore, collection, addDoc, getDocs, deleteDoc, doc, query, where, updateDoc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
    apiKey: "AIzaSyA3QRDlZkS9-NnupC5KN65fMv1j39ZovsI",
    authDomain: "my-dashboard-dc67a.firebaseapp.com",
    projectId: "my-dashboard-dc67a",
    storageBucket: "my-dashboard-dc67a.firebasestorage.app",
    messagingSenderId: "710702954120",
    appId: "1:710702954120:web:f06b1038c48d3bd328913d"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let currentLang = "DE";
let allItems = []; 

window.onload = () => { loadData(); };

async function loadData() {
  const list = document.getElementById("list");
  list.innerHTML = "<p class='muted'>Загружаем твои слова...</p>";
  document.getElementById("titleDisplay").innerText = `Язык: ${currentLang}`;

  try {
    const q = query(
      collection(db, "languages"), 
      where("lang", "==", currentLang)
    );
    
    const snapshot = await getDocs(q);
    allItems = [];
    
    snapshot.forEach(docSnap => {
      const data = docSnap.data();
      data.id = docSnap.id;
      // Поддержка обратной совместимости со старыми полями lecture
      if (!data.group) data.group = data.lecture || "1";
      allItems.push(data);
    });
    
    allItems.sort((a, b) => (b.created || 0) - (a.created || 0));
    
    renderGroupChips();
    renderList(allItems);
  } catch (err) {
    console.error(err);
    list.innerHTML = "<p style='color:red'>Ошибка доступа к Firebase.</p>";
  }
}

// Отрисовка кнопок-чипсов для выбора групп
function renderGroupChips() {
  const container = document.getElementById("groupSelectorContainer");
  // Собираем уникальные группы и сортируем (если цифры, то по порядку)
  const groups = [...new Set(allItems.map(i => String(i.group)))].sort((a, b) => {
    return a.localeCompare(b, undefined, { numeric: true });
  });
  
  if (groups.length === 0) {
    container.innerHTML = `<p class='muted'>Пока нет созданных групп. Добавь слова!</p>`;
    return;
  }
  
  let html = "";
  groups.forEach(g => {
    html += `
      <div class="group-chip active" data-group="${g}" onclick="toggleGroupChip(this)">
        Группа ${g}
      </div>
    `;
  });
  container.innerHTML = html;
}

window.toggleGroupChip = (el) => {
  el.classList.toggle("active");
};

window.toggleAllGroups = (status) => {
  document.querySelectorAll('.group-chip').forEach(chip => {
    if (status) chip.classList.add("active");
    else chip.classList.remove("active");
  });
};

function renderList(items) {
  const list = document.getElementById("list");
  list.innerHTML = "";
  if (items.length === 0) { 
    list.innerHTML = `<p class='muted'>Здесь пока пусто.</p>`; 
    return; 
  }

  const fragment = document.createDocumentFragment();
  
  items.forEach((e, index) => {
    const isFav = e.favorite === true;
    const isLearned = e.learned === true;
    const div = document.createElement('div');
    div.className = 'card';
    div.innerHTML = `
        <div style="display:flex; justify-content:space-between; align-items: center;">
            <h3 style="margin:0">${index + 1}. ${e.text} <span style="font-size:12px; background:rgba(241,196,15,0.2); color:var(--gold); padding:3px 8px; border-radius:6px; margin-left:10px;">Группа ${e.group}</span></h3>
            <div style="display:flex; gap:15px; align-items:center;">
                <button class="learn-btn ${isLearned ? 'active' : 'inactive'}" onclick="toggleLearned('${e.id}', ${isLearned})">
                    <i class="fas fa-check-circle"></i>
                </button>
                <button class="fav-btn ${isFav ? 'active' : 'inactive'}" onclick="toggleFav('${e.id}', ${isFav})">
                    <i class="${isFav ? 'fas' : 'far'} fa-heart"></i>
                </button>
                <button class="btn" style="background:none; color:var(--error); padding:0; width:auto;" onclick="removeItem('${e.id}')">
                    <i class="fas fa-trash"></i>
                </button>
            </div>
        </div>
        <p style="font-size:18px; margin: 10px 0;"><b>${e.translation}</b></p>
        ${e.note ? `<div class="feedback-note">💡 ${e.note}</div>` : ""}
    `;
    fragment.appendChild(div);
  });
  list.appendChild(fragment);
}

window.applySearch = () => {
    const val = document.getElementById("search").value.toLowerCase();
    if (val.length === 0) {
        renderList(allItems);
        return;
    }
    const filtered = allItems.filter(i => 
        (i.text && i.text.toLowerCase().includes(val)) || 
        (i.translation && i.translation.toLowerCase().includes(val))
    );
    renderList(filtered);
};

async function toggleFav(id, currentState) {
    const wordDoc = doc(db, "languages", id);
    await updateDoc(wordDoc, { favorite: !currentState });
    loadData();
}

async function toggleLearned(id, currentState) {
    const wordDoc = doc(db, "languages", id);
    await updateDoc(wordDoc, { learned: !currentState });
    loadData();
}

async function add() {
  const valText = document.getElementById("text").value.trim();
  const valTrans = document.getElementById("translation").value.trim();
  const valGroup = document.getElementById("groupInput").value.trim() || "1";
  const valNote = document.getElementById("note").value.trim();
  
  if (!valText || !valTrans) return alert("Заполни слово и перевод!");

  await addDoc(collection(db, "languages"), {
    lang: currentLang, 
    text: valText, 
    translation: valTrans, 
    group: valGroup, 
    note: valNote, 
    favorite: false, 
    learned: false, 
    created: Date.now()
  });

  document.getElementById("text").value = "";
  document.getElementById("translation").value = "";
  document.getElementById("note").value = "";
  loadData();
}

// --- ЛОГИКА ЭКЗАМЕНА ПО ВЫБРАННЫМ ГРУППАМ ---
let testWords = [];
let testIndex = 0;
let currentTestMode = 'all';
let correctCount = 0;

function startTestMode(mode) {
  currentTestMode = mode;
  let pool = [];
  
  if(mode === 'selected_groups') {
    // Собираем группы с активных (подсвеченных) чипсов
    const activeChips = [...document.querySelectorAll('.group-chip.active')];
    const selectedGroups = activeChips.map(chip => chip.getAttribute('data-group'));
    
    if (selectedGroups.length === 0) {
      alert("Выбери хотя бы одну группу нажатием на её кнопку!");
      return;
    }
    pool = allItems.filter(i => selectedGroups.includes(String(i.group)));
  } else if(mode === 'fav') {
    pool = allItems.filter(i => i.favorite === true);
  } else if(mode === 'learned') {
    pool = allItems.filter(i => i.learned === true);
  } else {
    pool = allItems; 
  }
  
  if (pool.length === 0) {
      alert("В выбранных группах нет слов для экзамена!");
      return;
  }
  
  document.getElementById("testBox").style.display = "block";
  document.getElementById("setupTest").style.display = "block";
  
  let modeName = mode === 'selected_groups' ? 'Выбранные группы' : (mode === 'fav' ? 'Избранное' : (mode === 'learned' ? 'Изученное' : 'Все слова'));
  document.getElementById("testStatusMsg").innerText = `Язык: ${currentLang} | Режим: ${modeName} | Доступно слов: ${pool.length}`;
  document.getElementById("testArea").innerHTML = "";
  window.scrollTo({top: 0, behavior: 'smooth'});
}

function beginTest() {
  const count = Number(document.getElementById("testCount").value);
  let pool = [];

  if(currentTestMode === 'selected_groups') {
    const activeChips = [...document.querySelectorAll('.group-chip.active')];
    const selectedGroups = activeChips.map(chip => chip.getAttribute('data-group'));
    pool = allItems.filter(i => selectedGroups.includes(String(i.group)));
  } else if(currentTestMode === 'fav') {
    pool = allItems.filter(i => i.favorite === true);
  } else if(currentTestMode === 'learned') {
    pool = allItems.filter(i => i.learned === true);
  } else {
    pool = allItems;
  }

  testWords = [...pool].sort(() => Math.random() - 0.5).slice(0, count);
  testIndex = 0;
  correctCount = 0;
  document.getElementById("setupTest").style.display = "none";
  showQuestion();
}

function showQuestion() {
  const area = document.getElementById("testArea");
  if (testIndex >= testWords.length) {
    area.innerHTML = `
      <div style="text-align:center; padding: 20px 0;">
        <h3>🎉 Экзамен завершен!</h3>
        <p style="font-size:20px;">Результат: <b>${correctCount}</b> из <b>${testWords.length}</b></p>
        <button class="btn" style="background:var(--success)" onclick="document.getElementById('testBox').style.display='none'">Закрыть</button>
      </div>`;
    return;
  }
  const word = testWords[testIndex];
  area.innerHTML = `
    <div class="test-header-row">
      <p class="test-q-count">Вопрос ${testIndex + 1} из ${testWords.length}</p>
      <span style="font-size:12px; color:var(--gold);">📁 Группа ${word.group}</span>
    </div>
    <div class="test-word">${word.text}</div>
    <input id="userAnswer" placeholder="Напиши перевод..." style="margin-bottom:15px;" onkeydown="if(event.key==='Enter') checkAnswer()">
    <button class="btn" id="checkBtn" style="width:100%; padding: 15px; justify-content: center;" onclick="checkAnswer()">Проверить</button>
    <div id="answerResult"></div>
  `;
  document.getElementById("userAnswer").focus();
}

function checkAnswer() {
  const userIn = document.getElementById("userAnswer").value.trim().toLowerCase();
  const word = testWords[testIndex];
  const correctAns = word.translation.trim().toLowerCase();
  const resDiv = document.getElementById("answerResult");
  
  if(!userIn) return;

  document.getElementById("checkBtn").style.display = "none";
  document.getElementById("userAnswer").disabled = true;

  if (userIn === correctAns) {
    correctCount++;
    resDiv.innerHTML = `
      <div class="result-box result-correct">
        ✅ Красава, верно!
      </div>
      <button class="btn" style="margin-top:15px; width:100%; background:var(--success); justify-content: center;" onclick="nextQuestion()">Дальше</button>
    `;
  } else {
    resDiv.innerHTML = `
      <div class="result-box result-wrong">
        ❌ Не угадал!<br>
        <span style="font-size:14px; color:#fff;">Правильный ответ: <b>${word.translation}</b></span>
      </div>
      <button class="btn" style="margin-top:15px; width:100%; background:var(--accent); justify-content: center;" onclick="nextQuestion()">Дальше</button>
    `;
  }
}

async function removeItem(id) {
  if(confirm("Удалить слово из базы?")) {
    await deleteDoc(doc(db, "languages", id));
    loadData();
  }
}

function nextQuestion() { testIndex++; showQuestion(); }
function setLang(l) { currentLang = l; loadData(); }

window.add = add; window.removeItem = removeItem; window.setLang = setLang; 
window.toggleGroupChip = toggleGroupChip; window.toggleAllGroups = toggleAllGroups;
window.startTestMode = startTestMode; window.beginTest = beginTest; 
window.checkAnswer = checkAnswer; window.nextQuestion = nextQuestion; 
window.toggleFav = toggleFav; window.toggleLearned = toggleLearned;
</script>
</body>
</html>
