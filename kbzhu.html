<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Pro Nutri Tracker v3.5 - Menu Edition</title>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <style>
        :root { --bg: #0d1117; --card: #161b22; --accent: #238636; --blue: #58a6ff; --text: #c9d1d9; --border: #30363d; --danger: #f85149; --gold: #f1c40f; --grey-text: #8b949e; }
        * { box-sizing: border-box; }
        body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', sans-serif; margin: 0; padding: 15px; overflow-x: hidden; }
        
        /* Переключатель языков в шапке */
        .top-nav-bar { max-width: 1200px; margin: 0 auto 15px auto; display: flex; justify-content: flex-end; }
        .lang-switcher { display: flex; gap: 5px; }
        .lang-btn { background: var(--card); color: var(--text); border: 1px solid var(--border); padding: 5px 10px; border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: bold; transition: 0.2s; }
        .lang-btn.active { background: var(--blue); color: #fff; border-color: var(--blue); }

        .container { max-width: 1200px; margin: 0 auto; display: grid; grid-template-columns: 380px 1fr; gap: 20px; width: 100%; }
        
        /* Шапка КБЖУ */
        .goals-header { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 20px; margin-bottom: 20px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; }
        .goal-item { text-align: center; }
        .goal-label-row { display: flex; justify-content: center; align-items: baseline; gap: 5px; margin-bottom: 5px; font-size: 11px; font-weight: bold; color: var(--grey-text); }
        .current-val { font-size: 16px; color: var(--blue); }
        .goal-item input { width: 100%; max-width: 80px; text-align: center; font-weight: bold; background: #0d1117; border: 1px solid var(--border); color: #fff; border-radius: 4px; padding: 4px; font-size: 13px; margin-top: 5px; }
        .progress-mini { height: 6px; background: #30363d; border-radius: 3px; margin-top: 10px; overflow: hidden; }
        .progress-fill { height: 100%; background: var(--accent); transition: 0.3s; width: 0%; }

        /* Отчет */
        .summary-card { background: linear-gradient(145deg, #1c2128, #161b22); border: 2px solid var(--gold); border-radius: 12px; padding: 20px; margin-bottom: 20px; display: none; z-index: 1000; position: relative; }
        .summary-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 15px; }
        .stat-box { background: #0d1117; padding: 15px; border-radius: 8px; border: 1px solid var(--border); text-align: center; }
        .stat-box big { display: block; font-size: 24px; font-weight: bold; margin: 5px 0; }

        /* Панель управления */
        .panel { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 15px; height: fit-content; position: sticky; top: 15px; }
        .main-input { width: 100%; background: #0d1117; border: 1px solid var(--border); color: white; padding: 10px; border-radius: 8px; margin-bottom: 10px; font-size: 14px; }
        .bju-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 10px; }
        .bju-row input { width: 100%; padding: 8px; text-align: center; font-size: 12px; background: #0d1117; border: 1px solid var(--border); color: white; border-radius: 6px; }
        
        /* ВКЛАДКИ */
        .panel-tabs { display: flex; gap: 10px; margin-bottom: 15px; border-bottom: 1px solid var(--border); padding-bottom: 10px; }
        .tab-btn { background: none; border: none; color: var(--grey-text); cursor: pointer; font-weight: bold; font-size: 14px; padding: 5px 10px; }
        .tab-btn.active { color: var(--blue); border-bottom: 2px solid var(--blue); }

        .btn { border: none; padding: 12px; border-radius: 8px; font-weight: bold; cursor: pointer; width: 100%; transition: 0.2s; }
        .btn-add { background: var(--accent); color: white; }
        .btn-finish { background: var(--gold); color: #000; margin-top: 20px; font-size: 14px; }

        /* База продуктов */
        .lib-list { margin-top: 15px; max-height: 400px; overflow-y: auto; padding-right: 5px; }
        .lib-card { background: #21262d; border: 1px solid var(--border); padding: 10px; border-radius: 8px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
        .lib-info { flex: 1; overflow: hidden; }
        .lib-info b { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 13px; color: #fff; }
        .lib-actions { display: flex; gap: 5px; flex-shrink: 0; align-items: center; }
        .btn-sm { width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; background: #30363d; color: #fff; border-radius: 6px; border: none; cursor: pointer; font-size: 14px; }

        /* СЕРДЕЧКО */
        .fav-btn { background: none; border: none; cursor: pointer; font-size: 18px; transition: 0.2s; padding: 0 5px; }
        .fav-btn:hover { transform: scale(1.2); }
        .fav-btn.active { color: #e74c3c; }
        .fav-btn.inactive { color: var(--grey-text); opacity: 0.4; }

        /* История */
        .day-block { margin-bottom: 15px; background: #161b22; border-radius: 10px; border: 1px solid var(--border); overflow: hidden; }
        .day-header { background: #1c2128; padding: 12px 15px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
        .day-info { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
        .day-stats-brief { font-size: 11px; color: #ccc; background: #2d333b; padding: 4px 12px; border-radius: 6px; display: flex; gap: 12px; border: 1px solid var(--border); }
        .day-stats-brief b { color: #ffffff; font-weight: 800; }
        .stat-val-pos { color: var(--danger) !important; }
        .stat-val-neg { color: #56d364 !important; }

        .eat-list { padding: 10px; display: block; }
        .eat-list.collapsed { display: none; }
        .eat-card { background: #0d1117; border: 1px solid var(--border); border-radius: 8px; padding: 10px; margin-bottom: 5px; display: flex; justify-content: space-between; align-items: center; }
        .del-btn { color: var(--danger); background: none; border: none; cursor: pointer; font-size: 18px; }

        /* Категории приемов пищи */
        .meal-group { margin-bottom: 15px; border-left: 3px solid var(--blue); padding-left: 10px; }
        .meal-title { font-size: 13px; font-weight: bold; color: var(--blue); margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; background: #1c2128; padding: 8px 12px; border-radius: 6px; }
        .meal-totals { 
            font-weight: bold; 
            color: #fff; 
            font-size: 12px; 
            background: rgba(88, 166, 255, 0.15); 
            padding: 4px 10px; 
            border-radius: 6px; 
            border: 1px solid rgba(88, 166, 255, 0.4);
            letter-spacing: 0.5px;
        }

        @media (max-width: 900px) { .container { grid-template-columns: 1fr; } .goals-header { grid-template-columns: repeat(2, 1fr); } }
    </style>
</head>

<div class="goals-header" id="mainHeader">

    </div>
    <div class="goal-item">
        <div class="goal-label-row"><span id="t-proteins-label">БЕЛКИ</span> <span id="curP" class="current-val">0</span></div>
        <input type="number" id="goalP" value="170" oninput="renderHistory()">

    </div>
    <div class="goal-item">
        <div class="goal-label-row"><span id="t-fats-label">ЖИРЫ</span> <span id="curF" class="current-val">0</span></div>
        <input type="number" id="goalF" value="70" oninput="renderHistory()">
        <div class="progress-mini"><div id="barF" class="progress-fill"></div></div>
    </div>
    <div class="goal-item">
        <div class="goal-label-row"><span id="t-carbs-label">УГЛЕВОДЫ</span> <span id="curC" class="current-val">0</span></div>
        <input type="number" id="goalC" value="240" oninput="renderHistory()">
        <div class="progress-mini"><div id="barC" class="progress-fill"></div></div>
    </div>
</div>

<div class="container">
    <div class="panel">
        <div class="panel-tabs">
            <button id="tabLib" class="tab-btn active" onclick="switchTab('lib')">БАЗА</button>
            <button id="tabMenu" class="tab-btn" onclick="switchTab('menu')">МЕНЮ ❤️</button>
        </div>

        <div id="formContainer">
            <input type="text" id="pName" class="main-input" placeholder="Название блюда">
            <div class="bju-row">
                <input type="number" id="pP" placeholder="Б">
                <input type="number" id="pF" placeholder="Ж">
                <input type="number" id="pC" placeholder="У">
                <input type="number" id="pK" placeholder="Ккал">
            </div>
            <label style="font-size:12px; color:var(--gold); display:flex; align-items:center; gap:5px; margin-bottom:15px; cursor:pointer;">
                <input type="checkbox" id="pIsPortion"> <span id="t-portion-label">Целая порция</span>
            </label>
            <button id="saveBtn" class="btn btn-add" onclick="saveToLib()">СОХРАНИТЬ В БАЗУ</button>
            <button id="cancelBtn" style="display:none; background:none; color:gray; border:none; margin-top:8px; cursor:pointer; width:100%;" onclick="resetForm()">Отмена</button>
        </div>
        
        <input type="text" id="libSearch" class="main-input" style="margin-top:20px; border-color: var(--blue);" placeholder="🔍 Поиск..." oninput="renderLibrary()">
        <div id="libraryList" class="lib-list"></div>

        <button id="t-finish-day-btn" class="btn btn-finish" onclick="finishDay()">✅ ЗАВЕРШИТЬ ДЕНЬ</button>
    </div>

    <div id="history"></div>
</div>

    function setLanguage(lang) {
        localStorage.setItem("site_lang", lang);
        
        document.querySelectorAll(".lang-btn").forEach(btn => btn.classList.remove("active"));
        const activeBtn = document.getElementById("btn-" + lang);
        if (activeBtn) activeBtn.classList.add("active");

        const t = translations[lang] || translations.uk;

        document.getElementById("t-summary-title").innerText = t.summaryTitle;
        document.getElementById("t-fat-change-label").innerText = t.fatChangeLabel;
        document.getElementById("t-muscle-status-label").innerText = t.muscleStatusLabel;
        document.getElementById("t-close-summary").innerText = t.closeSummary;
        
        document.getElementById("t-kcal-label").innerText = t.kcal;
        document.getElementById("t-proteins-label").innerText = t.proteins;
        document.getElementById("t-fats-label").innerText = t.fats;
        document.getElementById("t-carbs-label").innerText = t.carbs;

        document.getElementById("tabLib").innerText = t.tabLib;
        document.getElementById("tabMenu").innerText = t.tabMenu;

        document.getElementById("pName").placeholder = t.placeholderName;
        document.getElementById("t-portion-label").innerText = t.portionLabel;
        
        const saveBtnEl = document.getElementById("saveBtn");
        if(editId) {
            saveBtnEl.innerText = t.updateBtn;
        } else {
            saveBtnEl.innerText = t.saveBtn;
        }
        document.getElementById("cancelBtn").innerText = t.cancelBtn;
        document.getElementById("libSearch").placeholder = t.searchPlaceholder;
        document.getElementById("t-finish-day-btn").innerText = t.finishDayBtn;

        renderLibrary();
        renderHistory();
    }

    setLanguage(savedLang);

        messagingSenderId: "710702954120",
        appId: "1:710702954120:web:90e5e9a158f31d9728913d"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    let totals = { k:0, p:0, f:0, c:0 };

    db.collection("food_library").onSnapshot(snap => { library = snap.docs.map(d => ({id: d.id, ...d.data()})); renderLibrary(); });
    db.collection("daily_summaries").onSnapshot(snap => { summaries = {}; snap.forEach(doc => { summaries[doc.data().date] = doc.data(); }); renderHistory(); });
    db.collection("day_logs").orderBy("ts", "desc").onSnapshot(snap => { logs = snap.docs.map(d => ({id: d.id, ...d.data()})); renderHistory(); });

    function switchTab(tab) {
        currentTab = tab;
        document.getElementById('tabLib').classList.toggle('active', tab === 'lib');

        document.getElementById('formContainer').style.display = tab === 'menu' ? 'none' : 'block';

    }

    // --- ОТРИСОВКА БАЗЫ ---
    function renderLibrary() {
        const currentLangKey = localStorage.getItem("site_lang") || "uk";
        const t = translations[currentLangKey] || translations.uk;

        const q = document.getElementById('libSearch').value.toLowerCase();
        const list = document.getElementById('libraryList');
        list.innerHTML = "";
        
        let filtered = library.filter(i => i.name.toLowerCase().includes(q));
        if (currentTab === 'menu') {
            filtered = filtered.filter(i => i.isFavorite === true);
        }

        filtered.forEach(item => {
            const isFav = item.isFavorite === true;
            list.innerHTML += `<div class="lib-card">
                <button class="fav-btn ${isFav ? 'active' : 'inactive'}" onclick="toggleFavorite('${item.id}', ${isFav})">
                    ${isFav ? '❤️' : '🤍'}
                </button>
                <div class="lib-info"><b>${item.name}</b><small>Б:${item.p} Ж:${item.f} К:${item.k}</small></div>
                <div class="lib-actions">
                    <button class="btn-sm" style="background:var(--accent)" onclick="addToDay('${item.id}')">+</button>
                    <button class="btn-sm" onclick="editProduct('${item.id}')">✏️</button>
                    <button class="btn-sm" style="background:var(--danger)" onclick="deleteFromLib('${item.id}')">🗑️</button>
                </div>
            </div>`;
        });

        if (currentTab === 'menu' && filtered.length === 0) {
            list.innerHTML = `<div style="text-align:center; padding:20px; color:gray; font-size:12px;">${t.emptyMenu}</div>`;
        }
    }

    async function toggleFavorite(id, currentStatus) {
        await db.collection("food_library").doc(id).update({ isFavorite: !currentStatus });
    }

    // --- ОТРИСОВКА ИСТОРИИ И ШАПКИ ---
    function renderHistory() {
        const currentLangKey = localStorage.getItem("site_lang") || "uk";
        const t = translations[currentLangKey] || translations.uk;

        const container = document.getElementById('history');
        const today = new Date().toLocaleDateString('ru-RU');
        const groups = {};
        totals = { k:0, p:0, f:0, c:0 };

        logs.forEach(l => {
            if(!groups[l.date]) groups[l.date] = [];
            groups[l.date].push(l);
            if(l.date === today) { 
                totals.k += Number(l.k); totals.p += Number(l.p); totals.f += Number(l.f); totals.c += Number(l.c); 
            }
        });

        const displayK = isDayFinished ? 0 : totals.k;
        const displayP = isDayFinished ? 0 : totals.p;
        const displayF = isDayFinished ? 0 : totals.f;
        const displayC = isDayFinished ? 0 : totals.c;

        const up = (idC, idB, cur, idG) => {
            const g = parseFloat(document.getElementById(idG).value) || 1;
            document.getElementById(idC).innerText = Math.round(cur);
            document.getElementById(idB).style.width = Math.min((cur/g)*100, 100) + "%";
            document.getElementById(idB).style.background = cur > g ? "var(--danger)" : "var(--accent)";
        };
        up('curK', 'barK', displayK, 'goalK'); up('curP', 'barP', displayP, 'goalP');
        up('curF', 'barF', displayF, 'goalF'); up('curC', 'barC', displayC, 'goalC');

        let html = "";
        for (const date in groups) {
            const isToday = date === today;
            const s = summaries[date];
            let brief = "";
            
            if (s) {
                const fatVal = parseFloat(s.fatChange);
                const isNegative = fatVal < 0;
                const fatClass = isNegative ? 'stat-val-neg' : 'stat-val-pos';
                const sign = fatVal > 0 ? "+" : ""; 
                brief = `<div class="day-stats-brief">
                    <span><b>${Math.round(s.totals.k)}</b> ккал</span>
                    <span>Б:<b>${Math.round(s.totals.p)}</b> Ж:<b>${Math.round(s.totals.f)}</b> У:<b>${Math.round(s.totals.c)}</b></span>
                    <span class="${fatClass}"><b>${sign}${fatVal}г жира</b></span>
                    <span>${s.muscleStatus}</span>
                </div>`;
            } else if (isToday) { 
                brief = `<div class="day-stats-brief">${t.inProgress}</div>`; 
            }

            const mealGroups = {};
            groups[date].forEach(log => {
                const cat = log.mealType || "Перекус";
                if(!mealGroups[cat]) mealGroups[cat] = { items: [], k:0, p:0, f:0, c:0 };
                mealGroups[cat].items.push(log);
                mealGroups[cat].k += Number(log.k);
                mealGroups[cat].p += Number(log.p);
                mealGroups[cat].f += Number(log.f);
                mealGroups[cat].c += Number(log.c);
            });

            let mealHtml = "";
            mealCategories.forEach(catName => {
                if(mealGroups[catName]) {
                    const m = mealGroups[catName];
                    let translatedCatName = catName;
                    if(catName === "Завтрак") translatedCatName = t.breakfast;
                    if(catName === "Обед") translatedCatName = t.lunch;
                    if(catName === "Ужин") translatedCatName = t.dinner;
                    if(catName === "Перекус") translatedCatName = t.snack;

                    mealHtml += `
                        <div class="meal-group">
                            <div class="meal-title">
                                <span>${translatedCatName}</span>
                                <span class="meal-totals">
                                    Ккал: ${Math.round(m.k)} | Б: ${m.p.toFixed(1)} | Ж: ${m.f.toFixed(1)} | У: ${m.c.toFixed(1)}
                                </span>
                            </div>
                            ${m.items.map(i => `
                                <div class="eat-card">
                                    <div style="flex:1"><b>${i.name}</b><br><small>${i.w}${typeof i.w==='number'?'г':''} | Б:${i.p} Ж:${i.f} У:${i.c} К:${i.k}</small></div>
                                    <button class="del-btn" onclick="deleteLog('${i.id}')">×</button>
                                </div>`).join('')}
                        </div>`;
                }
            });

            html += `<div class="day-block">
                <div class="day-header" onclick="toggleDay('${date}')">
                    <div class="day-info"><b style="color:${isToday?'var(--blue)':'#fff'}">${isToday?t.todayLabel:date}</b>${brief}</div>
                    <span style="font-size:10px">${isToday?'▼':'▶'}</span>
                </div>
                <div id="list-${date}" class="eat-list ${!isToday?'collapsed':''}">
                    ${mealHtml}
                </div>
            </div>`;
        }
        container.innerHTML = html;
    }

    // --- ФИНАЛ ДНЯ ---
    async function finishDay() {
        const currentLangKey = localStorage.getItem("site_lang") || "uk";
        const t = translations[currentLangKey] || translations.uk;

        const gK = parseFloat(document.getElementById('goalK').value) || 2300;
        const gP = parseFloat(document.getElementById('goalP').value) || 170;
        const kcalDiff = totals.k - gK; 
        const fatChange = parseFloat((kcalDiff / 7.7).toFixed(1)); 
        
        let mStat = t.retention;
        if (totals.p >= gP) { 
            mStat = (totals.k >= (gK - 200)) ? t.growth : t.preservation; 
        } else { 
            mStat = t.loss; 
        }

        const fatResEl = document.getElementById('fatResult');
        fatResEl.innerText = (fatChange > 0 ? "+" : "") + fatChange + "г";
        fatResEl.style.color = fatChange <= 0 ? "var(--accent)" : "var(--danger)";
        document.getElementById('fatDesc').innerText = fatChange <= 0 ? t.fatBurned : t.fatStored;
        document.getElementById('muscleResult').innerText = mStat;
        
        isDayFinished = true;
        renderHistory();

        document.getElementById('summaryDisplay').style.display = 'block';
        window.scrollTo({top: 0, behavior: 'smooth'});

        await db.collection("daily_summaries").doc(new Date().toLocaleDateString('ru-RU')).set({
            date: new Date().toLocaleDateString('ru-RU'),
            totals: {...totals},
            fatChange: fatChange,
            muscleStatus: mStat,
            ts: firebase.firestore.FieldValue.serverTimestamp()
        });
    }

    // --- ФУНКЦИИ БАЗЫ ---
    async function saveToLib() {
        const name = document.getElementById('pName').value;
        const p = parseFloat(document.getElementById('pP').value) || 0;
        const f = parseFloat(document.getElementById('pF').value) || 0;
        const c = parseFloat(document.getElementById('pC').value) || 0;
        const k = parseFloat(document.getElementById('pK').value) || (p*4 + f*9 + c*4);
        const isPortion = document.getElementById('pIsPortion').checked;
        if(!name) return;
        const data = { name, p, f, c, k: Math.round(k), isPortion, isFavorite: false };
        if(editId) { await db.collection("food_library").doc(editId).update(data); editId = null; }
        else { await db.collection("food_library").add(data); }
        resetForm();
    }

    async function addToDay(id) {
        const currentLangKey = localStorage.getItem("site_lang") || "uk";
        const t = translations[currentLangKey] || translations.uk;

        isDayFinished = false; 
        const p = library.find(x => x.id === id);
        
        let mealType = prompt(t.promptMealType, "1");
        if (!mealType) return;
        const typeMap = {"1":"Завтрак", "2":"Обед", "3":"Ужин", "4":"Перекус"};
        const selectedMeal = typeMap[mealType] || "Перекус";

        let w = p.isPortion ? "порция" : prompt(t.promptWeight, "100");
        if (!w) return;
        let d = { ...p, w: w === "порция" ? w : parseFloat(w), mealType: selectedMeal };
        if (!p.isPortion) { 
            const r = parseFloat(w)/100; 
            d.p=+(p.p*r).toFixed(1); d.f=+(p.f*r).toFixed(1); d.c=+(p.c*r).toFixed(1); d.k=+(p.k*r).toFixed(0); 
        }
        delete d.id; 
        await db.collection("day_logs").add({ ...d, date: new Date().toLocaleDateString('ru-RU'), ts: firebase.firestore.FieldValue.serverTimestamp() });
    }

    function resetForm() {
        const currentLangKey = localStorage.getItem("site_lang") || "uk";
        const t = translations[currentLangKey] || translations.uk;

        editId = null;
        ['pName','pP','pF','pC','pK'].forEach(i => document.getElementById(i).value = "");
        document.getElementById('pIsPortion').checked = false;
        document.getElementById('saveBtn').innerText = t.saveBtn;
        document.getElementById('cancelBtn').style.display = "none";
    }

    async function deleteLog(id) { 
        const currentLangKey = localStorage.getItem("site_lang") || "uk";
        const t = translations[currentLangKey] || translations.uk;
        if(confirm(t.deleteConfirm)) await db.collection("day_logs").doc(id).delete(); 
    }
    
    async function deleteFromLib(id) { 
        const currentLangKey = localStorage.getItem("site_lang") || "uk";
        const t = translations[currentLangKey] || translations.uk;
        if(confirm(t.deleteLibConfirm)) await db.collection("food_library").doc(id).delete(); 
    }
    
    function editProduct(id) {
        const currentLangKey = localStorage.getItem("site_lang") || "uk";
        const t = translations[currentLangKey] || translations.uk;

        const i = library.find(x => x.id === id);
        switchTab('lib'); 
        document.getElementById('pName').value = i.name; document.getElementById('pP').value = i.p;
        document.getElementById('pF').value = i.f; document.getElementById('pC').value = i.c;
        document.getElementById('pK').value = i.k; document.getElementById('pIsPortion').checked = i.isPortion;
        editId = id; document.getElementById('saveBtn').innerText = t.updateBtn; document.getElementById('cancelBtn').style.display = "block";
    }

    function toggleDay(date) { document.getElementById(`list-${date}`).classList.toggle('collapsed'); }
    function closeSummary() { 
        document.getElementById('summaryDisplay').style.display = 'none'; 
        const today = new Date().toLocaleDateString('ru-RU');
        const list = document.getElementById(`list-${today}`);
        if(list) list.classList.add('collapsed');
    }
</script>
